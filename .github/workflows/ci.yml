name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: feature-flag-service

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featureflags
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --coverage
        env:
          NODE_ENV: test

      - name: Integration tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: featureflags
          DB_SSL: "false"
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (Staging)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.IMAGE_NAME }}-staging
          region: us-central1
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }}
          flags: '--traffic-tag=canary --no-traffic'

      - name: Smoke test canary revision
        run: |
          SERVICE=${{ env.IMAGE_NAME }}-staging
          CANARY_URL=$(gcloud run services describe "$SERVICE" \
            --region=us-central1 \
            --format='value(status.traffic.filter("tag:canary").extract("url"))' | tr -d "[]'")
          if [ -z "$CANARY_URL" ]; then
            echo "Could not resolve canary URL — refusing to promote"
            exit 1
          fi
          echo "Probing $CANARY_URL/api/v1/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$CANARY_URL/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "Canary health check failed with status $STATUS — not promoting"
            exit 1
          fi

      - name: Promote canary to 100% traffic (Staging)
        run: |
          SERVICE=${{ env.IMAGE_NAME }}-staging
          NEW_REVISION=$(gcloud run services describe "$SERVICE" \
            --region=us-central1 \
            --format='value(status.latestReadyRevisionName)')
          gcloud run services update-traffic "$SERVICE" \
            --region=us-central1 \
            --to-revisions="$NEW_REVISION=100" \
            --update-tags=stable=$NEW_REVISION

  deploy-production:
    name: Deploy to Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy new revision (0% traffic — green)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.IMAGE_NAME }}-production
          region: us-central1
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }}
          flags: '--no-traffic --tag=green'

      - name: Verify green revision before it takes any traffic
        run: |
          SERVICE=${{ env.IMAGE_NAME }}-production
          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          NEW_REVISION=$(gcloud run services describe "$SERVICE" \
            --region=us-central1 \
            --format='value(status.latestCreatedRevisionName)')
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"
          PREV_REVISION=$(gcloud run services describe "$SERVICE" \
            --region=us-central1 \
            --format='value(status.traffic[0].revisionName)')
          echo "PREV_REVISION=$PREV_REVISION" >> "$GITHUB_ENV"

          GREEN_URL=$(gcloud run services describe "$SERVICE" \
            --region=us-central1 \
            --format='value(status.traffic.filter("tag:green").extract("url"))' | tr -d "[]'")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$GREEN_URL/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "Green revision unhealthy ($STATUS) — no traffic shifted, nothing to roll back"
            exit 1
          fi

      - name: Canary — route 10% traffic to new revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region=us-central1 \
            --to-revisions="$NEW_REVISION=10,$PREV_REVISION=90"

      - name: Validate canary — roll back on error spike
        run: |
          sleep 60
          ERROR_COUNT=$(gcloud logging read \
            'resource.type="cloud_run_revision" resource.labels.revision_name="'"$NEW_REVISION"'" severity=ERROR' \
            --freshness=2m --limit=100 --format=json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          if [ "$ERROR_COUNT" -gt "5" ]; then
            echo "Canary produced $ERROR_COUNT errors — rolling back to $PREV_REVISION"
            gcloud run services update-traffic "$SERVICE" \
              --region=us-central1 \
              --to-revisions="$PREV_REVISION=100"
            exit 1
          fi

      - name: Promote — 100% traffic to new revision, tag stable
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region=us-central1 \
            --to-revisions="$NEW_REVISION=100" \
            --update-tags=stable=$NEW_REVISION
